name: Release fonts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install build dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Check release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          font_version="$(python -c 'import build_font; print(build_font.VERSION)')"
          if [ "$RELEASE_TAG" != "v$font_version" ]; then
            echo "Release tag $RELEASE_TAG does not match font version v$font_version"
            exit 1
          fi

      - name: Build and validate fonts
        run: |
          python build_font.py
          python validate.py

      - name: Package release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_version="${RELEASE_TAG#v}"
          cp README.md dist/README.md
          cd dist
          zip -9 "DepartureMono14-${release_version}.zip" \
            DepartureMono14-Regular.bdf \
            DepartureMono14-Regular.otf \
            DepartureMono14-Regular.woff2 \
            OFL.txt \
            README.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" \
            dist/DepartureMono14-Regular.bdf \
            dist/DepartureMono14-Regular.otf \
            dist/DepartureMono14-Regular.woff2 \
            dist/DepartureMono14-${release_version}.zip \
            --generate-notes \
            --title "Departure Mono 14 ${release_version}"
